<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Grind Co.</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <a href="index.html">
        <picture>
          <source media="(max-width: 768px)" srcset="images/coffee-bag-logo.png">
          <source media="(min-width: 769px)" srcset="images/logo.png">
          <img src="images/logo.png" alt="Daily Grind Co." class="logo-img" />
        </picture>
      </a>

      <!-- Pure HTML/CSS Burger Toggle -->
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation menu">
    <label for="nav-toggle" class="nav-toggle-label">
      <span></span>
    </label>
    
      <nav class="site-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content TBD -->
  <main class="site-main">
    <section class="contact">
      <div class="container">
        <h2>Contact Us</h2>
        <p>
          Have questions or feedback? We'd love to hear from you! Please fill
          out the form below, and we'll get back to you as soon as possible.
        </p>
        <form action="#" method="post" class="contact-form">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit" class="btn">Send Message</button>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 Daily Grind Co. All rights reserved.</p>
      </div>
    </footer>
</body>

</html>
